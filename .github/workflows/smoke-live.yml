name: Smoke (live API)

# Exercises the hackforfacts integration against the public transparenta.eu
# API. Run manually from the Actions tab or weekly — it is intentionally not
# part of the PR pipeline because it depends on a third-party service.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # every Monday, 06:17 UTC

jobs:
  smoke:
    name: smoke live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Smoke test against the live API
        run: pnpm smoke:live
