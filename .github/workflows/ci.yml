name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Check (typecheck, lint, test, format)
        run: pnpm check
      - name: Build
        run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ro-budget-dashboard-bff:ci
